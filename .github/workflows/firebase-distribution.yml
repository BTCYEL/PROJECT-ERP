name: Build and Distribute APK

on:
  push:
    branches:
      - main  # Triggers automatically when pushing to your main branch

jobs:
  build_and_distribute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Distribute APK to Firebase
        uses: w9jds/firebase-action-distribution@v3
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          file: app/build/outputs/apk/debug/app-debug.apk
          groups: qa-team  # Add your tester group name here
